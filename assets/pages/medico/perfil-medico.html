<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Care Plus Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-medico.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-heart-fill text-white"></i>
      <span>Care Plus</span>
    </div>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="medico-profile-header">
      <div class="profile-edit-avatar">
        <div class="avatar-placeholder avatar-lg d-inline-flex align-items-center justify-content-center" style="border: 3px solid rgba(255,255,255,0.3); box-shadow: 0 8px 24px rgba(0,0,0,0.2);"><i class="bi bi-person"></i></div>
        <span class="profile-edit-btn"><i class="bi bi-camera-fill"></i></span>
      </div>
      <div class="profile-name">Dr. Fulano</div>
      <div class="profile-specialty">Ortopedista</div>
      <div class="profile-crm">CRM 12345-RJ</div>
    </div>
    <div class="form-card">
      <form>
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" placeholder="Fulano" value="Fulano">
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" placeholder="seu@email.com" value="dr.fulano@careplus.com">
        </div>
        <div class="mb-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" placeholder="000.000.000-00" data-mask="cpf" maxlength="14">
        </div>
        <div class="mb-3">
          <label class="form-label">CRM</label>
          <input type="text" class="form-control" placeholder="CRM">
        </div>
        <div class="mb-3">
          <label class="form-label">Especialidade</label>
          <select class="form-select">
            <option selected>Ortopedista</option>
            <option>Cardiologista</option>
            <option>Clínico Geral</option>
            <option>Dermatologista</option>
            <option>Oftalmologista</option>
            <option>Pediatra</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Sexo</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="sexo" id="sexoM" checked>
              <label class="form-check-label" for="sexoM">Masculino</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="sexo" id="sexoF">
              <label class="form-check-label" for="sexoF">Feminino</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Idade</label>
          <input type="number" class="form-control" placeholder="Idade">
        </div>
        <div class="mb-4">
          <label class="form-label">Telefone</label>
          <input type="text" class="form-control" placeholder="+00 (00) 00000-0000" data-mask="telefone">
        </div>
        <button type="button" class="btn btn-success-careplus w-100 py-3"><i class="bi bi-check-circle me-2"></i>SALVAR ALTERAÇÕES</button>
      </form>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-medico.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-medico.html" class="active"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-medico.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
