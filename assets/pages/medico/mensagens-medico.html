<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens - Care Plus Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-medico.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Mensagens</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="search-bar-modern mb-4">
      <i class="bi bi-search search-icon"></i>
      <input type="text" class="form-control" placeholder="Pesquisar conversa...">
    </div>
    <h2 class="section-title"><i class="bi bi-chat-dots-fill"></i> Conversas</h2>
    <a href="mensagens-chat-medico.html" class="text-decoration-none">
      <div class="card card-careplus p-3 mb-2" style="border-left: 3px solid var(--careplus-green);">
        <div class="d-flex gap-3 align-items-center">
          <div class="position-relative">
            <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
            <span class="position-absolute" style="bottom: 2px; right: 2px; width: 10px; height: 10px; background: var(--careplus-green); border-radius: 50%; border: 2px solid #fff;"></span>
          </div>
          <div class="flex-grow-1 min-w-0">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong class="text-dark">Paciente Tiago</strong>
              <span class="text-muted" style="font-size: 0.7rem;">8:34</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <p class="text-muted small mb-0 text-truncate" style="max-width: 200px;">Quais sintomas você está sentindo?</p>
              <span class="badge rounded-pill" style="background: var(--careplus-green); font-size: 0.65rem; min-width: 20px;">2</span>
            </div>
          </div>
        </div>
      </div>
    </a>
    <a href="mensagens-chat-medico.html" class="text-decoration-none">
      <div class="card card-careplus p-3 mb-2">
        <div class="d-flex gap-3 align-items-center">
          <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
          <div class="flex-grow-1 min-w-0">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong class="text-dark">Paciente Ronaldo</strong>
              <span class="text-muted" style="font-size: 0.7rem;">Ontem</span>
            </div>
            <p class="text-muted small mb-0 text-truncate" style="max-width: 220px;">Obrigado doutor!</p>
          </div>
        </div>
      </div>
    </a>
    <a href="mensagens-chat-medico.html" class="text-decoration-none">
      <div class="card card-careplus p-3 mb-2">
        <div class="d-flex gap-3 align-items-center">
          <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
          <div class="flex-grow-1 min-w-0">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong class="text-dark">Paciente Fernando</strong>
              <span class="text-muted" style="font-size: 0.7rem;">Ontem</span>
            </div>
            <p class="text-muted small mb-0 text-truncate" style="max-width: 220px;">Até a próxima consulta</p>
          </div>
        </div>
      </div>
    </a>
  </div>
  <nav class="nav-bottom">
    <a href="home-medico.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-medico.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-medico.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
