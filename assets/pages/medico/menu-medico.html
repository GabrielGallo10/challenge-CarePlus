<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Care Plus Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-medico.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Menu</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="menu-doctor-header">
      <div class="avatar-placeholder flex-shrink-0" style="border: 2px solid rgba(255,255,255,0.3);"><i class="bi bi-person"></i></div>
      <div class="doctor-info">
        <div class="doctor-name">Dr. Fulano</div>
        <div class="doctor-specialty"><i class="bi bi-award-fill"></i> Ortopedista · CRM 12345</div>
      </div>
      <a href="perfil-medico.html" class="text-white" style="font-size: 1.1rem;"><i class="bi bi-pencil-square"></i></a>
    </div>
    <div class="menu-list card-careplus p-0">
      <a href="agenda-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-calendar3"></i></span>
        <span class="app-card-label">Agenda</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="historico-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-clock-history"></i></span>
        <span class="app-card-label">Histórico</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="mensagens-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-chat-dots"></i></span>
        <span class="app-card-label">Mensagens</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="clientes-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-people"></i></span>
        <span class="app-card-label">Clientes</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="notificacoes-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-bell"></i></span>
        <span class="app-card-label">Notificações</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
    </div>
    <div class="menu-list card-careplus p-0">
      <a href="perfil-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-person"></i></span>
        <span class="app-card-label">Meu perfil</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="../auth/login.html" class="app-card text-decoration-none">
        <span class="app-card-icon text-danger"><i class="bi bi-box-arrow-right"></i></span>
        <span class="app-card-label text-danger">Sair</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-medico.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-medico.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-medico.html" class="active"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
