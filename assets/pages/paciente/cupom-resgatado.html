<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupom resgatado - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="carteira-digital.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Carteira Digital</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container text-center py-4">
    <div class="success-check"><i class="bi bi-check-lg"></i></div>
    <h2 class="h5 text-white mb-2">Cupom resgatado com sucesso!</h2>
    <p class="text-white-50 small mb-4">Seu cupom de desconto está pronto para uso</p>
    <div class="card card-careplus p-4 mb-2">
      <p class="text-muted small mb-2">Seu código do cupom</p>
      <div class="d-flex align-items-center justify-content-center gap-2 p-3 rounded-3 mb-3" style="background: rgba(0, 76, 95, 0.08); border: 2px dashed rgba(0, 76, 95, 0.2);">
        <code class="text-dark fw-bold fs-5" id="codigo-cupom">CARE50-XKPT9</code>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-copiar" title="Copiar código">
          <i class="bi bi-clipboard"></i>
        </button>
      </div>
      <p class="text-muted small mb-0"><i class="bi bi-info-circle me-1"></i>Apresente este código na hora do pagamento da consulta</p>
    </div>
    <div class="d-flex flex-column gap-2 mt-4">
      <a href="meus-cupons.html" class="btn btn-success-careplus py-3"><i class="bi bi-tag me-2"></i>MEUS CUPONS</a>
      <a href="home-paciente.html" class="btn btn-careplus py-3">PÁGINA INICIAL</a>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    document.getElementById('btn-copiar').addEventListener('click', function () {
      var codigo = document.getElementById('codigo-cupom').textContent;
      navigator.clipboard.writeText(codigo).then(function () {
        var btn = document.getElementById('btn-copiar');
        btn.innerHTML = '<i class="bi bi-check-lg"></i>';
        btn.classList.remove('btn-outline-secondary');
        btn.classList.add('btn-success');
        setTimeout(function () {
          btn.innerHTML = '<i class="bi bi-clipboard"></i>';
          btn.classList.remove('btn-success');
          btn.classList.add('btn-outline-secondary');
        }, 2000);
      });
    });
  </script>
</body>
</html>
