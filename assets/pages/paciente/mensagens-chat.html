<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Dr. Claudio - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header d-flex align-items-center gap-2">
    <a href="mensagens.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <div class="position-relative">
      <div class="avatar-placeholder" style="width:36px;height:36px;font-size:1rem;background:rgba(255,255,255,0.2);color:#fff;"><i class="bi bi-person"></i></div>
      <span class="position-absolute" style="bottom: 0; right: 0; width: 10px; height: 10px; background: var(--careplus-green); border-radius: 50%; border: 2px solid var(--careplus-teal);"></span>
    </div>
    <div class="flex-grow-1">
      <span class="d-block fw-bold" style="font-size: 0.95rem;">Dr. Claudio</span>
      <span class="d-block" style="font-size: 0.7rem; color: rgba(255,255,255,0.7);">Online · Ortopedista</span>
    </div>
    <a href="detalhes-consulta.html" class="text-white" style="font-size: 1.1rem;"><i class="bi bi-info-circle"></i></a>
  </header>
  <div class="main-container d-flex flex-column" style="height: calc(100vh - 140px);">
    <div id="lista-mensagens" class="flex-grow-1 overflow-auto mb-3" style="padding: 0.5rem 0;">
      <div class="text-center mb-3">
        <span class="badge rounded-pill" style="background: rgba(255,255,255,0.15); font-size: 0.7rem; padding: 0.35rem 0.75rem;">Hoje</span>
      </div>
      <div class="d-flex justify-content-start mb-3">
        <div class="rounded-3 px-3 py-2 d-inline-block" style="max-width: 75%; background: rgba(255,255,255,0.95); color: var(--careplus-text); border-radius: 16px 16px 16px 4px !important; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <span>Olá, tudo certo?</span>
          <small class="d-block mt-1" style="font-size: 0.65rem; color: var(--careplus-text-muted);">8:18</small>
        </div>
      </div>
      <div class="d-flex justify-content-end mb-3">
        <div class="rounded-3 px-3 py-2 d-inline-block" style="max-width: 75%; background: var(--careplus-teal); color: #fff; border-radius: 16px 16px 4px 16px !important; box-shadow: 0 2px 8px rgba(0,76,95,0.3);">
          <span>Tudo sim doutor!</span>
          <small class="d-block mt-1" style="font-size: 0.65rem; opacity: 0.7;">9:18 <i class="bi bi-check2-all"></i></small>
        </div>
      </div>
      <div class="d-flex justify-content-start mb-3">
        <div class="rounded-3 px-3 py-2 d-inline-block" style="max-width: 75%; background: rgba(255,255,255,0.95); color: var(--careplus-text); border-radius: 16px 16px 16px 4px !important; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <span>Quais sintomas você está sentindo atualmente?</span>
          <small class="d-block mt-1" style="font-size: 0.65rem; color: var(--careplus-text-muted);">9:20</small>
        </div>
      </div>
    </div>
    <form id="form-chat" class="d-flex gap-2 align-items-center" style="padding: 0.5rem 0;">
      <input type="text" id="input-mensagem" class="form-control" placeholder="Digite sua mensagem..." style="background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; color: #fff; padding: 0.7rem 1.15rem;">
      <button type="submit" class="btn btn-careplus d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; border-radius: 50%; padding: 0;"><i class="bi bi-send-fill"></i></button>
    </form>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
