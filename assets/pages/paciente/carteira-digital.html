<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira Digital - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-paciente.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Carteira Digital</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <!-- Hero com nível e progresso -->
    <div class="wallet-hero">
      <div class="wallet-level-row">
        <div>
          <div class="wallet-level-badge">
            <i class="bi bi-trophy-fill"></i>
            Nível 2
          </div>
          <div class="wallet-level-name mt-1">Explorador</div>
        </div>
        <div class="text-end">
          <span class="text-white small opacity-90">20 / 250 pontos no nível</span>
        </div>
      </div>
      <div class="wallet-level-progress-wrap">
        <div class="wallet-level-progress-text">
          <span>Progresso para o próximo nível</span>
          <span class="fw-bold">230 pontos</span>
        </div>
        <div class="wallet-level-progress-bar">
          <div class="fill" style="width: 0.8%;"></div>
        </div>
      </div>
    </div>

    <!-- Saldo em destaque -->
    <div class="wallet-saldo-card">
      <div class="wallet-saldo-label">Seu saldo</div>
      <div class="wallet-saldo-value">
        <i class="bi bi-coin wallet-coin"></i> 1.350
      </div>
      <div class="wallet-actions">
        <a href="carteira-recompensas.html" class="btn btn-success-careplus">
          <i class="bi bi-gift-fill"></i> Trocar pontos
        </a>
        <a href="meus-cupons.html" class="btn btn-careplus">
          <i class="bi bi-tag-fill"></i> Meus cupons
        </a>
      </div>
    </div>

    <!-- Histórico -->
    <h2 class="wallet-section-title">
      <i class="bi bi-clock-history"></i> Histórico
    </h2>
    <div class="wallet-history-item">
      <div class="d-flex align-items-center">
        <div class="wallet-history-icon earn">
          <i class="bi bi-check-lg"></i>
        </div>
        <span class="desc">Consulta concluída</span>
      </div>
      <span class="points positive">+75 <i class="bi bi-coin"></i></span>
    </div>
    <div class="wallet-history-item">
      <div class="d-flex align-items-center">
        <div class="wallet-history-icon spend">
          <i class="bi bi-x-lg"></i>
        </div>
        <span class="desc">Consulta cancelada</span>
      </div>
      <span class="points negative">-50 <i class="bi bi-coin"></i></span>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html" class="active"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
