<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-paciente.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Menu</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="menu-list card-careplus p-0">
      <a href="agenda.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-calendar3"></i></span>
        <span class="app-card-label">Agenda</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="historico-paciente.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-clock-history"></i></span>
        <span class="app-card-label">Histórico</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="mensagens.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-chat-dots"></i></span>
        <span class="app-card-label">Mensagens</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="carteira-digital.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-wallet2"></i></span>
        <span class="app-card-label">Carteira Digital</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="ajuda.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-question-circle"></i></span>
        <span class="app-card-label">Ajuda</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
    </div>
    <div class="menu-list card-careplus p-0">
      <a href="perfil-paciente.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-person"></i></span>
        <span class="app-card-label">Meu perfil</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="../auth/login.html" class="app-card text-decoration-none">
        <span class="app-card-icon text-danger"><i class="bi bi-box-arrow-right"></i></span>
        <span class="app-card-label text-danger">Sair</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html" class="active"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
