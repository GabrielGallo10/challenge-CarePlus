<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="selecionar-medico.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Confirmar Agendamento</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <h2 class="screen-title mb-1">Resumo da consulta</h2>
    <p class="screen-subtitle">Revise os detalhes antes de confirmar</p>
    <div class="card card-careplus p-4 mb-3">
      <div class="d-flex gap-3 align-items-center mb-3">
        <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
        <div>
          <strong class="text-dark d-block">Dr. Claudio</strong>
          <span class="text-muted small">Ortopedista</span>
        </div>
      </div>
      <div class="border-top pt-3">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="bi bi-calendar3 icon-careplus"></i>
          <span class="text-dark small">Sexta-feira, 31 de Outubro de 2025</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="bi bi-clock icon-careplus"></i>
          <span class="text-dark small">9:00</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="bi bi-geo-alt icon-careplus"></i>
          <span class="text-dark small">Hospital HSIA - Rua Coronel Luiz Ferraz, 397, Itaperuna - RJ</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-coin" style="color: var(--careplus-orange);"></i>
          <span class="text-dark small">Você ganhará <strong style="color: var(--careplus-green);">+75 pontos</strong> ao concluir</span>
        </div>
      </div>
    </div>
    <div class="card card-careplus p-3 mb-4">
      <label class="form-label mb-2">Detalhes / Sintomas</label>
      <textarea class="form-control" rows="3" placeholder="Descreva seus sintomas ou motivo da consulta..."></textarea>
    </div>
    <a href="consulta-agendada.html" class="btn btn-success-careplus w-100 py-3">
      <i class="bi bi-check-circle me-2"></i>CONFIRMAR AGENDAMENTO
    </a>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
