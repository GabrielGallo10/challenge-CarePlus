<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcar Consulta - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="agenda.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Marcar Consulta</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="search-bar-modern">
      <i class="bi bi-search search-icon"></i>
      <input type="text" class="form-control" placeholder="Buscar especialidade ou médico..." value="Ortopedista">
    </div>
    <p class="text-white-50 small mb-3">2 resultados encontrados</p>
    <div class="card card-careplus p-4 mb-3">
      <div class="d-flex gap-3 align-items-start">
        <div class="avatar-placeholder avatar-lg flex-shrink-0"><i class="bi bi-person"></i></div>
        <div class="flex-grow-1">
          <span class="consult-specialty">Ortopedista</span>
          <strong class="text-dark d-block fs-6 mb-1">Dr. Claudio</strong>
          <div class="d-flex align-items-center gap-1 mb-2">
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-half" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <span class="text-muted small ms-1">4.5</span>
          </div>
          <p class="text-muted small mb-1"><i class="bi bi-hospital me-1"></i>Hospital HSA</p>
          <p class="text-muted small mb-0"><i class="bi bi-geo-alt me-1"></i>Rua Coronel Luiz Ferraz, 397 - Itaperuna, RJ</p>
        </div>
      </div>
      <a href="selecionar-medico.html" class="btn btn-success-careplus w-100 mt-3"><i class="bi bi-calendar-check me-2"></i>Selecionar médico</a>
    </div>
    <div class="card card-careplus p-4 mb-3">
      <div class="d-flex gap-3 align-items-start">
        <div class="avatar-placeholder avatar-lg flex-shrink-0"><i class="bi bi-person"></i></div>
        <div class="flex-grow-1">
          <span class="consult-specialty">Ortopedista</span>
          <strong class="text-dark d-block fs-6 mb-1">Dr. Roger</strong>
          <div class="d-flex align-items-center gap-1 mb-2">
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star-fill" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <i class="bi bi-star" style="color: var(--careplus-orange); font-size: 0.75rem;"></i>
            <span class="text-muted small ms-1">4.2</span>
          </div>
          <p class="text-muted small mb-1"><i class="bi bi-hospital me-1"></i>Hospital HSA</p>
          <p class="text-muted small mb-0"><i class="bi bi-geo-alt me-1"></i>Rua Coronel Luiz Ferraz, 397 - Itaperuna, RJ</p>
        </div>
      </div>
      <a href="selecionar-medico.html" class="btn btn-success-careplus w-100 mt-3"><i class="bi bi-calendar-check me-2"></i>Selecionar médico</a>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
