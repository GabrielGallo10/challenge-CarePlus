<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-careplus page-auth">
  <div class="main-container d-flex flex-column align-items-center justify-content-center py-5">
    <div class="logo-careplus">
      <i class="bi bi-heart-fill"></i>
      <span class="logo-title">Care Plus</span>
      <span class="logo-subtitle">Part of Bupa</span>
    </div>

    <div class="auth-toggle-external" id="login-toggle">
      <button type="button" class="btn active" id="btn-login-paciente">
        <i class="bi bi-person-fill"></i> Paciente
      </button>
      <button type="button" class="btn" id="btn-login-medico">
        <i class="bi bi-heart-pulse-fill"></i> Médico
      </button>
    </div>

    <div class="auth-card">
      <h2 class="text-center mb-1" style="font-size: 1.15rem; font-weight: 700; color: #1e293b;">Bem-vindo de volta</h2>
      <p class="text-center mb-4" style="font-size: 0.85rem; color: #94a3b8;" id="login-subtitle">Acesse sua conta de paciente</p>

      <form>
        <div class="mb-3">
          <label class="form-label">CPF</label>
          <div class="input-group">
            <span class="input-group-text" style="border-radius: 12px 0 0 12px; border: 1.5px solid #e5e7eb; border-right: none; background: #f8fafc; color: #94a3b8;">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control" placeholder="000.000.000-00" data-mask="cpf" maxlength="14" style="border-left: none; border-radius: 0 12px 12px 0;">
          </div>
        </div>
        <div class="mb-1">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <input type="password" class="form-control" placeholder="Digite sua senha" id="input-senha-login">
            <button type="button" class="btn toggle-senha" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="text-end mb-3">
          <a href="esqueci-senha.html" style="font-size: 0.8rem; color: var(--careplus-teal); text-decoration: none; font-weight: 500;">Esqueci minha senha</a>
        </div>
        <button type="button" class="btn btn-careplus w-100 py-2 mb-3" id="btn-entrar">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
        <div class="auth-separator">
          <hr><span>ou</span><hr>
        </div>
        <button type="button" class="btn btn-social w-100 py-2 mb-2">
          <i class="bi bi-google"></i> Continuar com Google
        </button>
        <button type="button" class="btn btn-social w-100 py-2">
          <i class="bi bi-facebook"></i> Continuar com Facebook
        </button>
        <div class="auth-links mt-4">
          <a href="cadastro.html">Não tem uma conta? <strong>Criar conta</strong></a>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    (function () {
      var btnPaciente = document.getElementById('btn-login-paciente');
      var btnMedico = document.getElementById('btn-login-medico');
      var btnEntrar = document.getElementById('btn-entrar');
      var subtitle = document.getElementById('login-subtitle');
      var tipo = 'paciente';

      btnPaciente.addEventListener('click', function () {
        tipo = 'paciente';
        btnPaciente.classList.add('active');
        btnMedico.classList.remove('active');
        subtitle.textContent = 'Acesse sua conta de paciente';
      });

      btnMedico.addEventListener('click', function () {
        tipo = 'medico';
        btnMedico.classList.add('active');
        btnPaciente.classList.remove('active');
        subtitle.textContent = 'Acesse sua conta de médico';
      });

      btnEntrar.addEventListener('click', function () {
        if (tipo === 'medico') {
          window.location.href = '../medico/home-medico.html';
        } else {
          window.location.href = '../paciente/home-paciente.html';
        }
      });
    })();
  </script>
</body>
</html>
