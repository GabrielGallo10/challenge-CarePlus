<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-careplus page-auth">
  <div class="main-container d-flex flex-column align-items-center justify-content-center py-5">
    <div class="logo-careplus">
      <i class="bi bi-heart-fill"></i>
      <span class="logo-title">Care Plus</span>
      <span class="logo-subtitle">Part of Bupa</span>
    </div>
    <div class="auth-card">
      <form>
        <div class="mb-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" placeholder="•••.•••.•••-••" data-mask="cpf" maxlength="14">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" placeholder="••••••••••">
        </div>
        <button type="button" class="btn btn-careplus w-100 py-2 mb-3" onclick="window.location.href='../paciente/home-paciente.html'">Entrar</button>
        <button type="button" class="btn btn-social w-100 py-2 mb-2">
          <i class="bi bi-google"></i> Entrar com Google
        </button>
        <button type="button" class="btn btn-social w-100 py-2 mb-3">
          <i class="bi bi-facebook"></i> Entrar com Facebook
        </button>
        <div class="auth-links">
          <a href="esqueci-senha.html">Esqueci minha senha</a>
          <a href="cadastro.html">Não tenho uma conta</a>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
