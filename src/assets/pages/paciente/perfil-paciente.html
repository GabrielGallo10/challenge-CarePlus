<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-paciente.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-heart-fill text-white"></i>
      <span class="small">Care Plus</span>
    </div>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="profile-header">
      <div class="profile-edit-avatar">
        <div class="avatar-placeholder avatar-lg d-inline-flex align-items-center justify-content-center"><i class="bi bi-person"></i></div>
        <span class="profile-edit-btn"><i class="bi bi-camera-fill"></i></span>
      </div>
      <div class="profile-name">Fulano da Silva</div>
      <div class="profile-email">fulano@email.com</div>
    </div>
    <div class="form-card">
      <form>
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" placeholder="Fulano" value="Fulano">
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" placeholder="seu@email.com" value="fulano@email.com">
        </div>
        <div class="mb-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" placeholder="000.000.000-00" data-mask="cpf" maxlength="14">
        </div>
        <div class="mb-3">
          <label class="form-label">Sexo</label>
          <select class="form-select"><option>Masculino</option><option>Feminino</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Data de nascimento</label>
          <input type="date" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Idade</label>
          <input type="number" class="form-control" placeholder="Idade">
        </div>
        <div class="mb-4">
          <label class="form-label">Telefone</label>
          <input type="text" class="form-control" placeholder="+00 (00) 00000-0000" data-mask="telefone">
        </div>
        <button type="button" class="btn btn-success-careplus w-100 py-3"><i class="bi bi-check-circle me-2"></i>Salvar alterações</button>
      </form>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html" class="active"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
