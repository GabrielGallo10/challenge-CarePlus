<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta agendada - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="agenda.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Agendamento</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container text-center py-4">
    <div class="success-check"><i class="bi bi-check-lg"></i></div>
    <h2 class="h5 text-white mb-2">Consulta agendada com sucesso!</h2>
    <p class="text-white-50 small mb-4">Você receberá lembretes perto da data marcada</p>
    <div class="card card-careplus p-4 mb-4">
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-person icon-careplus"></i>
        <span class="text-dark small fw-bold">Ortopedista - Dr. Claudio</span>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-calendar3 icon-careplus"></i>
        <span class="text-dark small">Sexta-feira, 31 de Outubro, às 9:00</span>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-geo-alt icon-careplus"></i>
        <span class="text-dark small">Rua Coronel Luiz Ferraz, 397 - Itaperuna, RJ</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-coin" style="color: var(--careplus-orange);"></i>
        <span class="text-dark small">Você ganhará <strong style="color: var(--careplus-green);">+75 pontos</strong></span>
      </div>
      <a href="ver-localizacao.html" class="btn btn-careplus btn-sm mt-3"><i class="bi bi-geo-alt me-1"></i>Ver Localização</a>
    </div>
    <div class="d-flex flex-column gap-2">
      <a href="agenda.html" class="btn btn-success-careplus py-3"><i class="bi bi-calendar3 me-2"></i>AGENDA</a>
      <a href="home-paciente.html" class="btn btn-careplus py-3">PÁGINA INICIAL</a>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
