<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Dr. Claudio - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header d-flex align-items-center gap-2">
    <a href="mensagens.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <div class="avatar-placeholder" style="width:32px;height:32px;font-size:1rem;"><i class="bi bi-person"></i></div>
    <span class="flex-grow-1">Dr. Claudio</span>
  </header>
  <div class="main-container d-flex flex-column" style="height: calc(100vh - 140px);">
    <div id="lista-mensagens" class="flex-grow-1 overflow-auto mb-3">
      <div class="d-flex justify-content-start mb-2">
        <div class="bg-light text-dark rounded-3 px-3 py-2 d-inline-block">
          <span>Olá, tudo certo?</span>
          <small class="d-block opacity-75">8:18</small>
        </div>
      </div>
      <div class="d-flex justify-content-end mb-2">
        <div class="rounded-3 px-3 py-2 d-inline-block" style="background: var(--careplus-teal); color: #fff;">
          <span>Tudo sim doutor!</span>
          <small class="d-block opacity-75">9:18</small>
        </div>
      </div>
    </div>
    <form id="form-chat" class="d-flex gap-2">
      <input type="text" id="input-mensagem" class="form-control" placeholder="mensagem">
      <button type="submit" class="btn btn-careplus"><i class="bi bi-send-fill"></i></button>
    </form>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html" class="active"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
