<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reivindicar cupom - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="carteira-recompensas.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Reivindicar Cupom</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <h2 class="screen-title mb-1">Confirmar resgate</h2>
    <p class="screen-subtitle">Revise antes de confirmar a troca de pontos</p>
    <div class="card card-careplus p-4 mb-3">
      <div class="text-center mb-3">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width: 56px; height: 56px; background: rgba(244, 162, 97, 0.15);">
          <i class="bi bi-gift-fill" style="font-size: 1.5rem; color: var(--careplus-orange);"></i>
        </div>
        <h3 class="h6 text-dark fw-bold mb-1">Consulta com 50% de desconto</h3>
      </div>
      <div class="border-top pt-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-muted small">Custo do cupom</span>
          <span class="fw-bold" style="color: var(--careplus-red);"><i class="bi bi-coin me-1"></i>-1.000</span>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-muted small">Saldo atual</span>
          <span class="text-dark fw-bold"><i class="bi bi-coin me-1" style="color: var(--careplus-orange);"></i>1.350</span>
        </div>
        <hr class="my-2">
        <div class="d-flex justify-content-between align-items-center">
          <span class="text-dark fw-bold">Saldo final</span>
          <span class="fw-bold" style="color: var(--careplus-green); font-size: 1.15rem;"><i class="bi bi-coin me-1"></i>350</span>
        </div>
      </div>
    </div>
    <p class="text-white-50 small text-center mb-4">
      <i class="bi bi-info-circle me-1"></i>Após resgatar, o cupom ficará disponível em "Meus Cupons" e poderá ser utilizado em sua próxima consulta.
    </p>
    <a href="cupom-resgatado.html" class="btn btn-success-careplus w-100 py-3">
      <i class="bi bi-check-circle me-2"></i>CONFIRMAR RESGATE
    </a>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
