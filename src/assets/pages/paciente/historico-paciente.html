<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-paciente.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Histórico</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="search-bar-modern">
      <i class="bi bi-search search-icon"></i>
      <input type="text" class="form-control" placeholder="Pesquisar consulta...">
    </div>
    <div class="d-flex gap-2 mb-4 overflow-auto" style="scrollbar-width: none;">
      <button class="btn btn-sm btn-careplus active" style="white-space: nowrap;">Todas</button>
      <button class="btn btn-sm btn-outline-light" style="white-space: nowrap;">Concluídas</button>
      <button class="btn btn-sm btn-outline-light" style="white-space: nowrap;">Canceladas</button>
    </div>
    <h2 class="section-title"><i class="bi bi-clock-history"></i> Ontem</h2>
    <div class="consult-card">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div class="d-flex gap-3">
          <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
          <div>
            <span class="consult-specialty">Oftalmologista</span>
            <div class="consult-title">Dr. Thiago</div>
            <p class="consult-meta mb-0"><i class="bi bi-hospital me-1"></i>Hospital HSA</p>
            <p class="consult-meta mb-0"><i class="bi bi-calendar3 me-1"></i>Terça-feira, 21 de Outubro, 16:00</p>
          </div>
        </div>
        <div class="text-end">
          <span class="consult-status confirmed"><i class="bi bi-check-circle-fill"></i> Concluída</span>
          <div class="consult-points mt-1"><i class="bi bi-coin"></i> +120</div>
        </div>
      </div>
    </div>
    <h2 class="section-title"><i class="bi bi-calendar3"></i> No último mês</h2>
    <div class="consult-card">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div class="d-flex gap-3">
          <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
          <div>
            <span class="consult-specialty">Oftalmologista</span>
            <div class="consult-title">Dr. Thiago</div>
            <p class="consult-meta mb-0"><i class="bi bi-hospital me-1"></i>Hospital HSA</p>
            <p class="consult-meta mb-0"><i class="bi bi-calendar3 me-1"></i>Quarta-feira, 15 de Outubro</p>
          </div>
        </div>
        <div class="text-end">
          <span class="consult-status confirmed"><i class="bi bi-check-circle-fill"></i> Concluída</span>
          <div class="consult-points mt-1"><i class="bi bi-coin"></i> +120</div>
        </div>
      </div>
    </div>
    <div class="consult-card">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div class="d-flex gap-3">
          <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
          <div>
            <span class="consult-specialty">Cardiologista</span>
            <div class="consult-title">Dr. Roger</div>
            <p class="consult-meta mb-0"><i class="bi bi-hospital me-1"></i>Hospital HSA</p>
            <p class="consult-meta mb-0"><i class="bi bi-calendar3 me-1"></i>Quarta-feira, 01 de Outubro</p>
          </div>
        </div>
        <div class="text-end">
          <span class="consult-status confirmed"><i class="bi bi-check-circle-fill"></i> Concluída</span>
          <div class="consult-points mt-1"><i class="bi bi-coin"></i> +120</div>
        </div>
      </div>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
