<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-heart-fill text-white" style="font-size: 1.5rem;"></i>
      <div><div class="logo-text">Care Plus</div><div class="logo-sub">Part of Bupa</div></div>
    </div>
    <a href="mensagens.html" class="position-relative text-white">
      <i class="bi bi-bell-fill"></i> <span class="badge-notification">1</span>
    </a>
  </header>
  <div class="main-container">
    <div class="home-welcome">
      <h1 class="screen-title">Olá, Ciclano</h1>
      <p class="screen-subtitle">Não há consultas marcadas</p>
    </div>
    <div class="home-level">
      <div class="home-level-top">
        <div class="home-level-badge">
          <i class="bi bi-trophy-fill"></i>
          <span>Nível 1</span>
        </div>
        <span class="home-level-name">Iniciante</span>
      </div>
      <p class="home-level-cta">Faça sua primeira consulta e ganhe pontos</p>
      <div class="home-level-stats">
        <span class="home-level-pts">20 <i class="bi bi-coin"></i></span>
        <span class="home-level-next">230 pts para o próximo nível</span>
      </div>
      <div class="home-level-bar">
        <div class="home-level-bar-fill" style="width: 8%;"></div>
      </div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-6">
        <a href="agenda.html" class="feature-card">
          <div class="feature-icon"><i class="bi bi-calendar3"></i></div>
          <span class="feature-label">Agenda</span>
        </a>
      </div>
      <div class="col-6">
        <a href="historico-paciente.html" class="feature-card">
          <div class="feature-icon"><i class="bi bi-clock-history"></i></div>
          <span class="feature-label">Histórico</span>
        </a>
      </div>
      <div class="col-6">
        <a href="mensagens.html" class="feature-card">
          <div class="feature-icon"><i class="bi bi-chat-dots"></i></div>
          <span class="feature-label">Mensagens</span>
        </a>
      </div>
      <div class="col-6">
        <a href="ajuda.html" class="feature-card">
          <div class="feature-icon"><i class="bi bi-question-circle"></i></div>
          <span class="feature-label">Ajuda</span>
        </a>
      </div>
    </div>
    <a href="carteira-digital.html" class="home-wallet-cta">
      <div class="home-wallet-cta-inner">
        <div class="home-wallet-cta-icon">
          <i class="bi bi-wallet2"></i>
        </div>
        <div class="home-wallet-cta-content">
          <span class="home-wallet-cta-title">Carteira digital</span>
          <span class="home-wallet-cta-saldo">1.350 <i class="bi bi-coin"></i></span>
        </div>
        <i class="bi bi-chevron-right home-wallet-cta-arrow"></i>
      </div>
      <div class="home-wallet-cta-bar">
        <div class="home-wallet-cta-bar-fill" style="width: 8%;"></div>
      </div>
      <span class="home-wallet-cta-hint">Nível 2 · 2/250 pts no nível</span>
    </a>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
