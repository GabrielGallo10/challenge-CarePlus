<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver localização - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="consulta-agendada.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Local da consulta</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="card card-careplus p-4 mb-3">
      <div class="d-flex gap-3 align-items-center mb-3 pb-3 border-bottom">
        <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
        <div>
          <strong class="text-dark d-block">Dr. Claudio</strong>
          <span class="text-muted small">Ortopedista</span>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-hospital icon-careplus"></i>
        <span class="text-dark small fw-bold">Hospital HSIA</span>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-geo-alt icon-careplus"></i>
        <span class="text-dark small">Rua Coronel Luiz Ferraz, 397 - Itaperuna, RJ</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-calendar3 icon-careplus"></i>
        <span class="text-dark small">Sexta-feira, 31 de Outubro, às 9:00</span>
      </div>
    </div>
    <div class="card card-careplus p-3 mb-3 text-center">
      <div class="rounded-3 d-flex flex-column align-items-center justify-content-center mb-3" style="height: 200px; background: linear-gradient(135deg, rgba(0,76,95,0.08) 0%, rgba(0,168,120,0.08) 100%); border: 1px solid rgba(0,0,0,0.06);">
        <i class="bi bi-geo-alt-fill" style="font-size: 3rem; color: var(--careplus-teal); opacity: 0.5;"></i>
        <span class="text-muted small mt-2">Visualização do mapa</span>
      </div>
      <a href="https://www.google.com/maps/search/Rua+Coronel+Luiz+Ferraz+397+Itaperuna+RJ" target="_blank" rel="noopener" class="btn btn-success-careplus w-100 py-3">
        <i class="bi bi-box-arrow-up-right me-2"></i>Abrir no Google Maps
      </a>
    </div>
    <a href="agenda.html" class="btn btn-careplus w-100 py-3"><i class="bi bi-arrow-left me-2"></i>Voltar para Agenda</a>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
