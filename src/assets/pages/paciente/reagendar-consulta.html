<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reagendar Consulta - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="detalhes-consulta.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Reagendar Consulta</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">

    <div class="card card-careplus p-3 mb-4">
      <div class="d-flex gap-3 align-items-center mb-3 pb-3 border-bottom">
        <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
        <div>
          <strong class="text-dark d-block">Dr. Claudio</strong>
          <span class="text-muted small">Ortopedista · Hospital HSIA</span>
        </div>
      </div>
      <p class="text-muted small mb-1"><i class="bi bi-calendar3 icon-careplus me-1"></i>Data atual: <strong class="text-dark">Sexta-feira, 17 de Outubro, 9:00</strong></p>
      <div class="d-flex align-items-center gap-2 mt-2 pt-2 border-top">
        <i class="bi bi-info-circle" style="color: var(--careplus-teal);"></i>
        <span class="text-muted" style="font-size: 0.75rem;">Reagendamentos com mais de 24h de antecedência não sofrem perda de pontos.</span>
      </div>
    </div>

    <h2 class="section-title"><i class="bi bi-calendar-event"></i> Escolha a nova data</h2>
    <div class="card card-careplus p-3 mb-4">
      <div id="reagendar-calendar"></div>
      <div class="d-flex align-items-center gap-2 mt-3 pt-3 border-top">
        <i class="bi bi-calendar-check icon-careplus"></i>
        <span class="text-dark small fw-bold" id="data-escolhida">Nenhuma data selecionada</span>
      </div>
    </div>

    <h2 class="section-title"><i class="bi bi-clock"></i> Escolha o novo horário</h2>
    <div class="slot-grid mb-4">
      <button type="button" class="btn btn-outline-light slot-btn">8:00</button>
      <button type="button" class="btn btn-outline-light slot-btn">8:30</button>
      <button type="button" class="btn btn-outline-light slot-btn active">9:30</button>
      <button type="button" class="btn btn-outline-light slot-btn">10:00</button>
      <button type="button" class="btn btn-outline-light slot-btn">11:00</button>
      <button type="button" class="btn btn-outline-light slot-btn">11:30</button>
      <button type="button" class="btn btn-outline-light slot-btn">14:00</button>
      <button type="button" class="btn btn-outline-light slot-btn">15:30</button>
      <button type="button" class="btn btn-outline-light slot-btn">17:00</button>
    </div>

    <a href="reagendamento-sucesso.html" class="btn btn-success-careplus w-100 py-3">
      <i class="bi bi-calendar2-check me-2"></i>CONFIRMAR REAGENDAMENTO
    </a>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/calendar.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    var meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    var diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    CarePlusCalendar.init('reagendar-calendar', {
      onSelect: function(date) {
        var d = diasSemana[date.getDay()];
        var mes = meses[date.getMonth()];
        document.getElementById('data-escolhida').textContent = d + ', ' + date.getDate() + ' de ' + mes + ' de ' + date.getFullYear();
      }
    });
    document.querySelectorAll('.slot-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.slot-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
