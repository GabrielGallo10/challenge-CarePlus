<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Claudio - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="marcar-consulta.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Agenda de Claudio</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="card card-careplus p-3 mb-3">
      <div class="d-flex gap-3 align-items-center">
        <div class="avatar-placeholder flex-shrink-0"><i class="bi bi-person"></i></div>
        <div>
          <strong class="text-dark d-block">Dr. Claudio</strong>
          <span class="text-muted small">Ortopedista · Hospital HSA</span>
        </div>
      </div>
    </div>
    <div class="card card-careplus p-3 mb-4">
      <div class="d-flex align-items-center gap-2 mb-1">
        <i class="bi bi-calendar-event icon-careplus"></i>
        <span class="text-muted small">Data escolhida</span>
      </div>
      <p class="text-dark fw-bold mb-2">Sexta-feira, 31 de outubro de 2025</p>
      <a href="agenda.html" class="small text-decoration-none" style="color: var(--careplus-teal); font-weight: 600;"><i class="bi bi-pencil-square me-1"></i>Alterar data</a>
    </div>
    <p class="text-white fw-bold mb-2">Horários disponíveis</p>
    <div class="slot-grid mb-4">
      <button type="button" class="btn btn-outline-light">8:00</button>
      <button type="button" class="btn btn-outline-light">8:30</button>
      <button type="button" class="btn btn-outline-light active">9:00</button>
      <button type="button" class="btn btn-outline-light">9:30</button>
      <button type="button" class="btn btn-outline-light">10:00</button>
      <button type="button" class="btn btn-outline-light">11:30</button>
      <button type="button" class="btn btn-outline-light">14:00</button>
      <button type="button" class="btn btn-outline-light">15:30</button>
      <button type="button" class="btn btn-outline-light">17:00</button>
    </div>
    <a href="confirmar-consulta.html" class="btn btn-success-careplus w-100 py-3"><i class="bi bi-check-circle me-2"></i>CONFIRMAR HORÁRIO</a>
  </div>
  <nav class="nav-bottom">
    <a href="home-paciente.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-paciente.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-paciente.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
