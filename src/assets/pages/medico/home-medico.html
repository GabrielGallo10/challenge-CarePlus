<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Care Plus Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-heart-fill text-white" style="font-size: 1.5rem;"></i>
      <div><div class="logo-text">Care Plus</div><div class="logo-sub">Part of Bupa</div></div>
    </div>
    <a href="mensagens-medico.html" class="text-white"><i class="bi bi-bell-fill"></i></a>
  </header>
  <div class="main-container">
    <div class="home-welcome mb-4">
      <h1 class="screen-title">Olá, Dr. Ciclano</h1>
      <p class="screen-subtitle mb-0">Você possui 2 consultas marcadas. Verifique sua agenda.</p>
    </div>
    <div class="d-flex flex-column gap-2">
      <a href="agenda-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-calendar3"></i></span>
        <span class="app-card-label">Agenda</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="historico-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-clock-history"></i></span>
        <span class="app-card-label">Histórico</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="mensagens-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-chat-dots"></i></span>
        <span class="app-card-label">Mensagens</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
      <a href="clientes-medico.html" class="app-card text-decoration-none">
        <span class="app-card-icon"><i class="bi bi-people"></i></span>
        <span class="app-card-label">Clientes</span>
        <i class="bi bi-chevron-right app-card-arrow"></i>
      </a>
    </div>
  </div>
  <nav class="nav-bottom">
    <a href="home-medico.html" class="active"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-medico.html"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-medico.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>

</html>
