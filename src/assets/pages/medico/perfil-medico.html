<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Care Plus Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="home-medico.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-heart-fill text-white"></i>
      <span>Care Plus</span>
    </div>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container">
    <div class="text-center mb-4">
      <div class="avatar-placeholder avatar-lg d-inline-flex align-items-center justify-content-center"><i class="bi bi-person"></i></div>
    </div>
    <form>
      <div class="mb-3">
        <label class="form-label text-white">Nome</label>
        <input type="text" class="form-control" placeholder="Fulano" value="Fulano">
      </div>
      <div class="mb-3">
        <label class="form-label text-white">CPF</label>
        <input type="text" class="form-control" placeholder="000.000.000-00" data-mask="cpf" maxlength="14">
      </div>
      <div class="mb-3">
        <label class="form-label text-white">CRM</label>
        <input type="text" class="form-control" placeholder="CRM">
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Especialidade</label>
        <input type="text" class="form-control" placeholder="Especialidade">
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Sexo</label>
        <div class="d-flex gap-3">
          <label class="text-white"><input type="radio" name="sexo" checked> Masculino</label>
          <label class="text-white"><input type="radio" name="sexo"> Feminino</label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Idade</label>
        <input type="number" class="form-control" placeholder="Idade">
      </div>
      <div class="mb-4">
        <label class="form-label text-white">Telefone</label>
        <input type="text" class="form-control" placeholder="+00 (00) 00000-0000" data-mask="telefone">
      </div>
      <button type="button" class="btn btn-success-careplus w-100 py-3">SALVAR ALTERAÇÕES</button>
    </form>
  </div>
  <nav class="nav-bottom">
    <a href="home-medico.html"><i class="bi bi-house-door-fill nav-icon"></i></a>
    <a href="perfil-medico.html" class="active"><i class="bi bi-person nav-icon"></i></a>
    <a href="menu-medico.html"><i class="bi bi-list nav-icon"></i></a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
