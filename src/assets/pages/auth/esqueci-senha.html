<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-careplus page-auth">
  <div class="main-container d-flex flex-column align-items-center justify-content-center py-5">
    <div class="logo-careplus">
      <i class="bi bi-heart-fill"></i>
      <span class="logo-title">Care Plus</span>
      <span class="logo-subtitle">Part of Bupa</span>
    </div>

    <div class="auth-card">
      <div class="auth-icon-circle teal">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h2 class="text-center mb-1" style="font-size: 1.15rem; font-weight: 700; color: #1e293b;">Recuperar senha</h2>
      <p class="text-center mb-4" style="font-size: 0.85rem; color: #94a3b8;">Informe seu CPF ou e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>

      <form class="w-100">
        <div class="mb-3">
          <label class="form-label">CPF ou E-mail</label>
          <div class="input-group">
            <span class="input-group-text" style="border-radius: 12px 0 0 12px; border: 1.5px solid #e5e7eb; border-right: none; background: #f8fafc; color: #94a3b8;">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="text" class="form-control" placeholder="CPF ou endereço de e-mail" style="border-left: none; border-radius: 0 12px 12px 0;">
          </div>
        </div>
        <button type="button" class="btn btn-careplus w-100 py-2 mb-3" id="btn-enviar-recuperacao">
          <i class="bi bi-send me-2"></i>Enviar link de recuperação
        </button>

        <div class="auth-success-msg" id="msg-sucesso">
          <i class="bi bi-check-circle-fill"></i>
          <span>Se o CPF ou e-mail estiver cadastrado, você receberá um link para redefinir sua senha em instantes.</span>
        </div>

        <div class="auth-links mt-3">
          <a href="login.html"><i class="bi bi-arrow-left me-1"></i> Voltar ao login</a>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    document.getElementById('btn-enviar-recuperacao').addEventListener('click', function () {
      var msg = document.getElementById('msg-sucesso');
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';
      setTimeout(function () {
        btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>Link enviado!';
        btn.classList.remove('btn-careplus');
        btn.classList.add('btn-success');
        msg.classList.add('show');
      }, 1500);
    });
  </script>
</body>
</html>
