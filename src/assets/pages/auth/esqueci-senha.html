<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha - Care Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-careplus page-auth">
  <header class="app-header">
    <a href="login.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i></a>
    <span class="flex-grow-1 text-center">Recuperar senha</span>
    <span style="width: 24px;"></span>
  </header>
  <div class="main-container py-5">
    <div class="logo-careplus mb-3">
      <i class="bi bi-heart-fill"></i>
      <span class="logo-title">Care Plus</span>
      <span class="logo-subtitle">Part of Bupa</span>
    </div>
    <div class="auth-card mx-auto">
      <p class="text-muted small text-center mb-4">Informe seu CPF ou e-mail cadastrado. Enviaremos um link para redefinir sua senha.</p>
      <form class="w-100">
        <div class="mb-3">
          <label class="form-label">CPF ou E-mail</label>
          <input type="text" class="form-control" placeholder="CPF ou e-mail" data-mask="cpf">
        </div>
        <button type="button" class="btn btn-careplus w-100 py-2 mb-3" id="btn-enviar-recuperacao">Enviar link</button>
        <div class="auth-links">
          <a href="login.html">Voltar ao login</a>
        </div>
      </form>
      <div id="msg-sucesso" class="alert alert-success mt-3 text-center small py-2" style="display: none;" role="alert">
        <i class="bi bi-check-circle me-2"></i>Se o CPF/e-mail estiver cadastrado, você receberá um link para redefinir a senha.
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    document.getElementById('btn-enviar-recuperacao').addEventListener('click', function () {
      document.getElementById('msg-sucesso').style.display = 'block';
    });
  </script>
</body>
</html>
